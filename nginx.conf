# Empty only for requests that did not come through Traefik — i.e. from another
# container on the Docker network. A client cannot forge this to empty: Traefik
# always appends the real peer IP.
map $http_x_forwarded_for $external_request {
    default 1;
    ""      0;
}

server {
    listen 80;

    # Re-resolve upstream hostnames via Docker's embedded DNS every 10 s.
    # Without this nginx caches the IP at startup; if a container restarts
    # and gets a new IP nginx can't reach it until nginx itself restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow large media uploads
    client_max_body_size 100M;

    # Fail fast instead of hanging when an upstream is down
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Pass real client IP and protocol from Coolify's Traefik proxy
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ── Monitoring ─────────────────────────────────────────────────────────────

    # nginx's own metrics endpoint, polled by Netdata's go.d nginx collector.
    # Without this the request falls through to `location /`, the web app's
    # locale hook redirects it, and the collector silently reads HTML forever.
    # Both paths are served: go.d defaults to /stub_status, older configs use
    # /basic_status.
    location ~ ^/(stub_status|basic_status)$ {
        # $remote_addr is useless for access control here: Traefik proxies public
        # traffic from a private 10.x address too, so an IP allowlist lets the whole
        # internet in. Anything that reached Traefik carries X-Forwarded-For; a
        # monitoring agent on the Docker network connects directly and has none.
        if ($external_request) {
            return 404;
        }
        stub_status;
        access_log off;
    }

    # ── Payload CMS paths ──────────────────────────────────────────────────────

    # Admin UI
    location /admin {
        set $cms http://cms:3000;
        proxy_pass $cms;
    }

    # Payload media files (S3-backed in production, local disk in dev).
    # Uploading a replacement in the admin creates a new filename rather than
    # overwriting, so a URL's bytes never change — safe to cache forever at the
    # CDN edge and in the browser. This is the header Bunny obeys; without it
    # every image request falls through to the CMS container.
    # (Exception: scripts/regenerate-media.ts overwrites in place — purge the
    # media pull zone after running it.)
    location ^~ /api/media/file/ {
        set $cms http://cms:3000;
        proxy_pass $cms;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # REST & GraphQL API
    location /api {
        set $cms http://cms:3000;
        proxy_pass $cms;
    }

    # Next.js internals (chunks, HMR, RSC payloads)
    location /_next {
        set $cms http://cms:3000;
        proxy_pass $cms;
    }

    # Payload media uploads (local disk storage)
    location /media {
        set $cms http://cms:3000;
        proxy_pass $cms;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── SvelteKit web app ──────────────────────────────────────────────────────

    # Content-hashed immutable assets — safe to cache forever at CDN and browser
    location ^~ /_app/immutable/ {
        set $web http://web:3001;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SvelteKit version file changes on every deploy — must never be cached
    location = /_app/version.json {
        set $web http://web:3001;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        set $web http://web:3001;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
